[project]
name = "diqds"
version = "0.5.0"
description = "Device-independent quantum digital signatures: Renyi finite-size bounds, trusted-randomness accounting, privacy-amplification analysis and a shot-level emulator (simulation only)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "qiskit>=2.6.2",
    "qiskit-aer>=0.18.4",
    "qutip>=5.3.1",
    "scipy>=1.18.1",
    "sequence>=1.3.1",
]

[tool.uv.build-backend]
module-name = "diqds"
module-root = "src"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
